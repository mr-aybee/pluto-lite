name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - uses: nuget/setup-nuget@v2
      - name: Restore
        run: nuget restore "pluto-lite/POS mini.sln"
      - name: Build
        run: msbuild "pluto-lite/POS mini.sln" /p:Configuration=Release /m /v:minimal
